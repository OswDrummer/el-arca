<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Arca - Catálogo</title>

    <!-- Archivo CSS externo (asegúrate de guardarlo en static/style.css) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Encabezado superior visible -->
    <header class="barra-superior">
    <div class="logo-titulo">
        <h1>El Arca</h1>
    </div>

    <!-- Contenedor con ambos contadores -->
    <div class="contenedor-badges">
        <div class="info-badge">
            <span class="etiqueta">Películas:</span>
            <strong class="numero">{{ total_peliculas }}</strong>
        </div>

        <div class="info-badge">
            <span class="etiqueta">Artistas:</span>
            <strong class="numero">{{ total_artistas }}</strong>
        </div>
    </div>
</header>

    <!-- Contenido principal -->
    <main class="contenedor-principal">
        <!-- Aquí irán tus tarjetas de artistas / lista de estilos -->
    </main>

</body>
</html>
